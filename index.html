<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>複数画像比較くん</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf7f2; --panel: #ffffff; --border: #e8e3da;
    --text: #2a2825; --text-soft: #7a766e;
    --accent: #e07856; --accent-deep: #c8553d; --accent-soft: #fbeae3;
    --success: #6b9450; --danger: #c0392b;
    --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
    --w: 200px; --label: 54px;
  }
  body {
    font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    padding: 8px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  body > header, #upPanel { flex: none; }
  #listPanel { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 0; }
  #listPanel > .panel-header { flex: none; }
  #boardWrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  button { font: inherit; }

  header {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 16px; margin-bottom: 10px; box-shadow: var(--shadow);
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: .02em; }
  .brand { align-items: center; }
  .logo-wrap { margin: 0; line-height: 0; }
  .logo { height: 44px; width: auto; display: block; }
  @media (max-width: 480px) { .logo { height: 34px; } }
  .version { font-size: 11px; font-weight: 700; color: var(--text-soft); background: #f0ece4; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 8px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
  .btn:hover { background: #fdfcfa; border-color: #d8d0c4; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn:disabled { opacity: .5; cursor: default; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
  .panel-header { padding: 10px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .panel-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
  .panel-title::before { content: ''; width: 4px; height: 15px; background: var(--accent); border-radius: 2px; }
  .panel-body { padding: 16px 18px; }

  /* ---- アップロード ---- */
  .up-row { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
  .drop { flex: 1 1 380px; display: flex; align-items: center; justify-content: center; gap: 14px; background: #fdfcfa; border: 2px dashed #d8d0c4; border-radius: 10px; padding: 18px 14px; text-align: left; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.drag { border-color: var(--accent); background: var(--accent-soft); }
  .drop .icon { font-size: 34px; line-height: 1; }
  .drop .big { font-size: 15px; font-weight: 700; }
  .drop .small { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .drop input { display: none; }

  /* ドラッグ中：受け付ける場所だけを点線で示し、ポインターが乗った場所だけ光らせる */
  .cell .ph.bl.vb { background: #fdfcfa; border: 1px dashed #e3ddd3; }
  .cell .ph.bl.vb small { color: #cdc6bb; }
  .cell .ph.bl.vb.over { border: 3px solid var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 4px rgba(224,120,86,.25); }
  .cell .ph.bl.vb.over small { color: var(--accent-deep); }
  .drop.drag { border-style: solid; box-shadow: 0 0 0 4px rgba(224,120,86,.2); }
  .cell .ph.bl.over { border: 3px solid var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 4px rgba(224,120,86,.25); }
  .cell .ph.bl.over span { color: var(--accent-deep); }
  .cell .ph.bl span small { display: block; font-size: 10px; font-weight: 500; margin-top: 2px; text-align: center; }

  /* ---- 一覧 ---- */
  .size-control { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .size-control .sc-label { font-size: 12px; color: var(--text-soft); font-weight: 600; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  .stepper button { font-size: 17px; font-weight: 700; line-height: 1; width: 32px; height: 32px; border: none; background: #fdfcfa; color: var(--accent-deep); cursor: pointer; }
  .stepper button:hover { background: var(--accent-soft); }
  .stepper input { width: 58px; height: 32px; border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; font: inherit; font-size: 13px; font-weight: 700; color: var(--text); -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .presets { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .presets button { border: none; background: #fff; padding: 0 12px; height: 32px; font-size: 13px; font-weight: 700; color: var(--text-soft); cursor: pointer; }
  .presets button + button { border-left: 1px solid var(--border); }
  .presets button.on { background: var(--accent-soft); color: var(--accent-deep); }
  .marks button { display: inline-flex; align-items: center; justify-content: center; padding: 0 9px; }
  .marks button svg { width: 18px; height: 18px; display: block; }
  .marks button.on { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .mark-hint { font-size: 11px; font-weight: 700; color: var(--accent-deep); }
  .sc-sep { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }
  /* 画像に付けたマーク */
  .cell .ph .mk { position: absolute; right: 4px; top: 4px; z-index: 2; width: clamp(22px, 30%, 64px); aspect-ratio: 1; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .cell .ph .mk svg { width: 100%; height: 100%; display: block; }
  .cell .ph.marked { border-width: 3px; }
  .cell .ph.mk-circle { border-color: #23934a; } .cell .ph.mk-tri { border-color: #e07b00; } .cell .ph.mk-square { border-color: #2c67d1; } .cell .ph.mk-cross { border-color: #d63333; }
  body.marking .cell .ph:not(.vb) { cursor: crosshair; }
  body.marking .cell .ph:not(.vb):hover { box-shadow: 0 0 0 3px rgba(224,120,86,.45); }

  .board { flex: 1; min-height: 0; overflow: auto; padding-bottom: 6px; }
  .board-inner { width: max-content; min-width: 100%; }
  .row { display: flex; align-items: flex-start; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .row.colnums { position: sticky; top: 0; z-index: 4; background: #fdfcfa; border-bottom: 1px solid var(--border); }
  .row.colnums .lab { background: #fdfcfa; padding-top: 6px; padding-bottom: 6px; font-size: 11px; justify-content: center; color: var(--text-soft); font-weight: 700; }
  .row.colnums .cn { width: var(--w); flex: none; padding: 6px 6px; text-align: center; font-size: 11px; font-weight: 700; color: var(--text-soft); }

  .lab { position: sticky; left: 0; z-index: 2; flex: none; width: var(--label); align-self: stretch; background: var(--panel); border-right: 1px solid var(--border); padding: 8px 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .lab .gname { align-self: stretch; font-size: 12px; font-weight: 800; line-height: 1.3; word-break: break-all; cursor: text; border-radius: 4px; }
  .lab .gname:hover { background: #f6f2ec; }
  .lab .gname[contenteditable="true"] { background: #fff; outline: 2px solid var(--accent); padding: 0 2px; }
  .lab .meta { font-size: 12px; font-weight: 700; color: var(--text-soft); white-space: nowrap; word-break: keep-all; }
  .lab .acts { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
  .lab .saving { font-size: 10px; color: var(--accent-deep); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .lab .saving .spinner { width: 9px; height: 9px; }
  .lab .ib { flex: none; width: 18px; height: 18px; padding: 0; border: 1px solid transparent; background: none; color: #b5afa5; font-size: 13px; line-height: 16px; text-align: center; border-radius: 5px; cursor: pointer; }
  .lab .ib:hover { color: var(--danger); border-color: #e6b8b2; background: #fdf3f2; }
  .lab .rdel { width: 40px; flex: none; margin-top: 4px; border: 1px solid var(--border); background: #fff; color: var(--text-soft); font-size: 11px; font-weight: 700; padding: 3px 0; border-radius: 5px; cursor: pointer; }
  .lab .rdel:hover { color: var(--danger); border-color: #e6b8b2; background: #fdf3f2; }
  .lab .bulk { width: 40px; height: 40px; margin-top: 6px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; font-weight: 800; line-height: 1.25; color: var(--accent-deep); background: var(--accent-soft); border: 2px dashed #e2a48e; border-radius: 6px; cursor: pointer; user-select: none; }
  .lab .bulk:hover { border-color: var(--accent); }
  .lab .bulk.over { border: 2px solid var(--accent-deep); background: var(--accent); color: #fff; box-shadow: 0 0 0 4px rgba(224,120,86,.25); }
  .lab .ib:disabled { opacity: .25; cursor: default; background: none; border-color: transparent; }
  .lab .ib.go { color: var(--text); font-weight: 800; font-size: 14px; border-color: var(--border); background: #fff; }
  .lab .ib.go:hover { color: var(--accent-deep); border-color: #ecc3b4; background: var(--accent-soft); }
  .lab .state { font-size: 11px; font-weight: 700; color: var(--accent-deep); display: flex; align-items: center; gap: 4px; }
  .lab .state.err { color: var(--danger); cursor: help; }
  .bar { height: 3px; background: #f0ece4; border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .cells { display: flex; align-items: stretch; }
  .cell { position: relative; flex: none; width: var(--w); padding: 8px 6px 10px; }
  /* 区切り線（列と列の間の縦線） */
  .divR::after { content: ''; position: absolute; top: 0; bottom: -1px; right: -1px; width: 2px; background: var(--accent-deep); pointer-events: none; z-index: 1; }
  .row.colnums .cn { position: relative; }
  .row.colnums .cn .dv { position: absolute; right: -8px; top: 50%; transform: translateY(-50%); z-index: 3; width: 16px; height: 22px; padding: 0; border: 1px dashed #cfc7bb; border-radius: 4px; background: #fff; cursor: pointer; opacity: .6; }
  .row.colnums .cn .dv::before { content: ''; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: #b5afa5; border-radius: 1px; }
  .row.colnums .cn .dv:hover { opacity: 1; border-color: var(--accent); }
  .row.colnums .cn .dv:hover::before { background: var(--accent); }
  .row.colnums .cn .dv.on { opacity: 1; border: 1px solid var(--accent-deep); background: var(--accent-deep); }
  .row.colnums .cn .dv.on::before { background: #fff; }
  .cell .ph { position: relative; background: #f4f1ec; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; cursor: zoom-in; }
  .cell img { display: block; width: 100%; height: auto; }
  .cell .no { position: absolute; left: 4px; top: 4px; background: rgba(42,40,37,.72); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .cell .fn { font-size: 10px; color: var(--text-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.pending .cell .ph { opacity: .7; }
  .cell .x { position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; padding: 0; border: none; border-radius: 50%; background: rgba(42,40,37,.72); color: #fff; font-size: 14px; line-height: 22px; text-align: center; cursor: pointer; opacity: .85; }
  .cell .x:hover { background: var(--danger); opacity: 1; }
  .cell .ph.bl { cursor: default; background: repeating-linear-gradient(135deg,#faf8f4 0 8px,#f3efe8 8px 16px); border: 2px dashed #d8d0c4; display: flex; align-items: center; justify-content: center; }
  .cell .ph.bl span { font-size: 12px; font-weight: 700; color: #b5afa5; text-align: center; padding: 0 6px; }
  .cell .tools { display: flex; gap: 4px; margin-top: 4px; }
  .cell .tools button { flex: 1; min-width: 0; border: 1px solid var(--border); background: #fff; color: var(--text-soft); font-size: 12px; line-height: 1; padding: 5px 0; border-radius: 5px; cursor: pointer; }
  .cell .tools2 { display: flex; gap: 4px; margin-top: 4px; }
  .cell .dl { flex: 1; min-width: 0; border: 1px solid var(--border); background: #fff; color: var(--text-soft); font-size: 11px; font-weight: 700; padding: 3px 0; border-radius: 5px; cursor: pointer; }
  .cell .dl:hover:not(:disabled) { color: var(--accent-deep); border-color: #ecc3b4; background: var(--accent-soft); }
  .cell .dl:disabled { opacity: .35; cursor: default; }
  .cell .del { display: block; flex: 1; min-width: 0; border: 1px solid var(--border); background: #fff; color: var(--text-soft); font-size: 11px; font-weight: 700; padding: 3px 0; border-radius: 5px; cursor: pointer; }
  .cell .del:hover { color: var(--danger); border-color: #e6b8b2; background: #fdf3f2; }
  .cell .tools button:hover { color: var(--accent-deep); border-color: #ecc3b4; background: var(--accent-soft); }

  .empty { padding: 40px 18px; text-align: center; color: var(--text-soft); font-size: 13px; }
  .empty .big { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty .btn { margin-top: 12px; }

  .spinner { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* アップロード欄を畳む */
  .fold-btn { border: 1px solid var(--border); background: #fff; color: var(--text-soft); font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 6px; cursor: pointer; }
  .fold-btn:hover { color: var(--accent-deep); border-color: #ecc3b4; background: var(--accent-soft); }
  .up-mini { display: none; font-size: 12px; color: var(--text-soft); font-weight: 500; }
  body.upc #upPanel .panel-body { display: none; }
  body.upc #upPanel .panel-header { border-bottom: none; padding-top: 6px; padding-bottom: 6px; }
  body.upc #upPanel { margin-bottom: 8px; }
  body.upc .up-mini { display: inline; }
  body.upc > header { padding-top: 5px; padding-bottom: 5px; margin-bottom: 8px; }
  body.upc .logo { height: 30px; }
  body.upc header .btn { padding-top: 4px; padding-bottom: 4px; }
  .up-btns { display: flex; gap: 6px; }
  .dl-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dlbar { display: none; flex: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 18px; background: var(--accent-soft); border-bottom: 1px solid #ecc3b4; font-size: 12px; }
  body.dlmode .dlbar { display: flex; }
  .dlbar b { color: var(--accent-deep); font-size: 13px; }
  .dlbar label { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--text-soft); }
  .dlbar select { font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  .dlbar input { width: 64px; font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  .dl-ex { color: var(--text-soft); }
  .dl-sp { flex: 1; }
  .dl-prog { font-weight: 700; color: var(--accent-deep); }
  body.dlmode .lab { cursor: pointer; }
  body.dlmode .lab .acts, body.dlmode .lab .rdel, body.dlmode .lab .bulk { display: none; }
  .lab .pick { display: none; width: 22px; height: 22px; border: 2px solid #cfc7bb; border-radius: 5px; background: #fff; margin-bottom: 4px; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 800; line-height: 1; }
  body.dlmode .row:not(.pending) .lab .pick { display: flex; }
  .row.picked .lab .pick { background: var(--accent); border-color: var(--accent); }
  .row.picked .lab { background: var(--accent-soft); }
  .row.picked { background: #fff6f1; }
  #upPanel.drag { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(224,120,86,.25); background: var(--accent-soft); }

  /* ---- モーダル ---- */
  .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(42,40,37,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 480px; padding: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .modal h2 { font-size: 16px; margin-bottom: 8px; }
  .modal p { font-size: 12px; color: var(--text-soft); margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; font-weight: 700; margin: 10px 0 4px; }
  .modal input { width: 100%; font: inherit; font-size: 14px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal .detect { font-size: 11px; color: var(--text-soft); margin-top: 4px; }
  .modal .row2 { display: flex; gap: 10px; }
  .modal .row2 > div:first-child { flex: 1; }
  .modal .row2 > div:last-child { width: 120px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .status { font-size: 12px; margin-top: 12px; min-height: 18px; }
  .status.ok { color: var(--success); font-weight: 700; }
  .status.err { color: var(--danger); font-weight: 700; }
  .status.loading { color: var(--text-soft); }

  /* ---- ログ ---- */
  .btn .dot { display: none; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; line-height: 16px; text-align: center; }
  .btn .dot.on { display: inline-block; }
  .modal.wide { max-width: 760px; }
  .loginfo { font-size: 11px; color: var(--text-soft); background: #fdfcfa; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.7; word-break: break-all; }
  .loglist { max-height: 55vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.55; }
  .loglist div { padding: 4px 10px; border-bottom: 1px solid #f3efe8; white-space: pre-wrap; word-break: break-all; }
  .loglist div:last-child { border-bottom: none; }
  .loglist .t { color: #a8a298; margin-right: 6px; }
  .loglist .err { background: #fdf3f2; color: var(--danger); }
  .loglist .ok { color: var(--success); }
  .loglist .none { color: var(--text-soft); text-align: center; padding: 20px; }

  /* ---- 拡大表示 ---- */
  .lb { position: fixed; inset: 0; z-index: 120; background: rgba(20,19,18,.94); display: none; flex-direction: column; }
  .lb.show { display: flex; }
  .lb-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #fff; gap: 10px; }
  .lb-cap { font-size: 13px; font-weight: 700; }
  .lb-cap small { font-weight: 500; opacity: .7; margin-left: 8px; }
  .lb-x { background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; line-height: 1; padding: 0 6px; }
  .lb-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 56px; }
  .lb-main img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12); border: none; color: #fff; font-size: 30px; width: 44px; height: 64px; border-radius: 8px; cursor: pointer; }
  .lb-nav:hover { background: rgba(255,255,255,.22); }
  .lb-nav.prev { left: 8px; } .lb-nav.next { right: 8px; }
  .lb-help { text-align: center; color: rgba(255,255,255,.6); font-size: 11px; padding: 8px; }

  @media (max-width: 600px) {
    :root { --label: 54px; }
    .lb-main { padding: 0 8px; }
    .lb-nav { width: 36px; height: 52px; font-size: 24px; }
  }
</style>
</head>
<body>

    <label for="ghToken">GitHub Personal Access Token（Contents: Read and write）</label>

<div class="lb" id="lb">

<script>
(function(){
  'use strict';
  var DIR = 'shared/hikaku';           // リポジトリ内の保存先
  var MAX_DIM = 1600, QUALITY = 0.85;  // アップ時の圧縮設定
  var MIN_COLS = 20;                   // 各商品は最低この列数まで枠を表示
  var WMIN = 80, WMAX = 700, WSTEP = 10, WDEF = 220;

  // ---------- 汎用 ----------
  function $(id){ return document.getElementById(id); }
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad2(n){ return (n<10?'0':'')+n; }
  function utf8b64(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64utf8(b64){ b64=b64.replace(/\s/g,''); try{ return decodeURIComponent(escape(atob(b64))); }catch(e){ return atob(b64); } }
  function fmtDate(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
  function natSort(a,b){ return a.localeCompare(b,'ja',{numeric:true,sensitivity:'base'}); }

  // ---------- ログ ----------
  var VERSION=(document.querySelector('.version')||{}).textContent||'';
  var logs=(function(){ try{ return JSON.parse(lsGet('hikaku:log')||'[]'); }catch(e){ return []; } })();
  var unseenErr=0;
  function log(level,msg){
    logs.push({t:Date.now(),l:level,m:String(msg)});
    if(logs.length>300) logs=logs.slice(-300);
    lsSet('hikaku:log',JSON.stringify(logs));
    if(level==='err'){ unseenErr++; updateLogDot(); }
    if($('logOverlay').classList.contains('show')) renderLog();
  }
  function updateLogDot(){ var d=$('logDot'); d.textContent=unseenErr; d.classList.toggle('on',unseenErr>0); }
  function fmtTime(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
  function tokenKind(tok){
    if(!tok) return '未設定';
    var kind=/^github_pat_/.test(tok)?'Fine-grained':/^ghp_/.test(tok)?'Classic':'不明な形式';
    var pre=(tok.match(/^(github_pat_|ghp_|gho_|ghs_|ghu_)/)||[''])[0];
    return kind+'（'+pre+'…'+tok.slice(-4)+'、'+tok.length+'文字）';
  }
  function envInfo(){
    var r=activeRepo();
    return ['バージョン：'+VERSION,
            'リポジトリ：'+(r?r.owner+'/'+r.repo+'（branch: '+r.branch+'）':'未設定')+(getRepoOverride()?'（手動設定）':'（URLから自動）'),
            'トークン：'+tokenKind(getToken()),
            'ページ：'+location.href,
            'ブラウザ：'+navigator.userAgent];
  }
  function renderLog(){
    $('logInfo').innerHTML=envInfo().map(esc).join('<br>');
    var el=$('logList');
    if(!logs.length){ el.innerHTML='<div class="none">まだログはありません</div>'; return; }
    el.innerHTML=logs.slice().reverse().map(function(x){
      return '<div class="'+(x.l==='err'?'err':x.l==='ok'?'ok':'')+'"><span class="t">'+fmtTime(x.t)+'</span>'+(x.l==='err'?'✗ ':x.l==='ok'?'✓ ':'')+esc(x.m)+'</div>';
    }).join('');
  }
  $('logBtn').addEventListener('click',function(){ unseenErr=0; updateLogDot(); renderLog(); $('logOverlay').classList.add('show'); });
  $('logClose').addEventListener('click',function(){ $('logOverlay').classList.remove('show'); });
  $('logOverlay').addEventListener('click',function(e){ if(e.target===$('logOverlay')) $('logOverlay').classList.remove('show'); });
  $('logClear').addEventListener('click',function(){ logs=[]; lsSet('hikaku:log','[]'); renderLog(); });
  $('logCopy').addEventListener('click',function(){
    var txt=envInfo().join('\n')+'\n----\n'+logs.map(function(x){ return fmtTime(x.t)+' ['+x.l+'] '+x.m; }).join('\n');
    var b=this;
    var done=function(){ b.textContent='コピー済'; setTimeout(function(){ b.textContent='コピー'; },1200); };
    try{ navigator.clipboard.writeText(txt).then(done,function(){ fallbackCopy(txt); done(); }); }catch(e){ fallbackCopy(txt); done(); }
  });
  function fallbackCopy(txt){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); }

  // ---------- 設定（トークンは表示確認くんと共通キー） ----------
  function getToken(){ return lsGet('hyoji:ghtoken')||''; }
  function getRepoOverride(){ try{ var s=lsGet('hikaku:repo'); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function detectRepo(){
    var m=location.hostname.match(/^([^.]+)\.github\.io$/i);
    if(!m) return null;
    var seg=location.pathname.split('/').filter(Boolean)[0];
    if(!seg || /\.html?$/i.test(seg)) return {owner:m[1],repo:m[1]+'.github.io',branch:'main'};
    return {owner:m[1],repo:seg,branch:'main'};
  }
  function activeRepo(){ return getRepoOverride()||detectRepo(); }

  var settingsOverlay=$('settingsOverlay'), setStatus=$('setStatus');
  function showSet(msg,cls){ setStatus.textContent=msg; setStatus.className='status '+(cls||''); }
  function openSettings(){
    var r=activeRepo(), det=detectRepo();
    $('ghToken').value=getToken();
    $('ghRepo').value=r?(r.owner+'/'+r.repo):'';
    $('ghBranch').value=r?(r.branch||'main'):'main';
    $('repoDetect').textContent=det?('自動検出：'+det.owner+'/'+det.repo+'（このページのURLから）'):'このページはGitHub Pages上ではないため、owner/repo を手入力してください。';
    showSet('');
    settingsOverlay.classList.add('show');
  }
  $('settingsBtn').addEventListener('click',openSettings);
  $('setClose').addEventListener('click',function(){ settingsOverlay.classList.remove('show'); });
  settingsOverlay.addEventListener('click',function(e){ if(e.target===settingsOverlay) settingsOverlay.classList.remove('show'); });
  $('setSave').addEventListener('click',function(){
    var tok=$('ghToken').value.trim(), rp=$('ghRepo').value.trim(), br=$('ghBranch').value.trim()||'main';
    if(tok) lsSet('hyoji:ghtoken',tok);
    if(rp.indexOf('/')>0){ var p=rp.split('/'); lsSet('hikaku:repo',JSON.stringify({owner:p[0].trim(),repo:p.slice(1).join('/').trim(),branch:br})); }
    showSet('✓ 保存しました','ok');
    setTimeout(function(){ settingsOverlay.classList.remove('show'); loadBoard(); },700);
  });
  $('setTest').addEventListener('click',async function(){
    var tok=$('ghToken').value.trim(), rp=$('ghRepo').value.trim();
    if(!tok){ showSet('トークンを入力してください','err'); return; }
    if(rp.indexOf('/')<1){ showSet('owner/repo を入力してください','err'); return; }
    showSet('接続テスト中...','loading');
    try{
      var res=await fetch('https://api.github.com/repos/'+rp,{headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'}});
      if(!res.ok) throw new Error(res.status+' '+res.statusText);
      var d=await res.json();
      // 書き込みテスト：空のblobを作るだけ（どこにも紐づかないのでリポジトリの中身は変わらない）
      var w=await fetch('https://api.github.com/repos/'+rp+'/git/blobs',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({content:'',encoding:'utf-8'})});
      if(!w.ok){
        log('err','接続テスト：'+rp+' 読み取りOK・書き込み不可（'+w.status+'） トークン：'+tokenKind(tok));
        showSet('✗ 読み取りはできますが、書き込みできません（'+w.status+'）。トークンの Repository access に '+d.name+' を追加し、Contents を Read and write にしてください。','err');
        return;
      }
      log('ok','接続テスト：'+d.full_name+' 読み書きOK');
      showSet('✓ 接続OK（書き込みも可能）：'+d.full_name+'（'+(d.private?'非公開':'公開')+'）'+(d.private?'　※画像表示には公開リポジトリ推奨':''),'ok');
    }catch(e){ log('err','接続テスト失敗：'+rp+' '+e.message+' トークン：'+tokenKind(tok)); showSet('✗ 失敗：'+e.message,'err'); }
  });
  function needSetup(){
    var token=getToken(), repo=activeRepo();
    if(!token||!repo||!repo.owner||!repo.repo){ openSettings(); showSet(!token?'まずトークンを設定してください':'owner/repo を設定してください','err'); return null; }
    return {token:token,repo:repo};
  }

  // ---------- GitHub API ----------
  function apiBase(repo){ return 'https://api.github.com/repos/'+repo.owner+'/'+repo.repo; }
  function rawBase(repo){ return 'https://raw.githubusercontent.com/'+repo.owner+'/'+repo.repo+'/'+repo.branch+'/'+DIR+'/'; }
  async function gh(url,opt,token){
    opt=opt||{};
    opt.headers=Object.assign({'Accept':'application/vnd.github+json','Content-Type':'application/json'},token?{'Authorization':'Bearer '+token}:{},opt.headers||{});
    var res=await fetch(url,opt);
    if(!res.ok){
      var t=await res.text().catch(function(){return '';});
      var msg=t; try{ var jj=JSON.parse(t); msg=jj.message||t; }catch(_){}
      var perm=res.headers.get('x-accepted-github-permissions');
      log('err','GitHub API '+(opt.method||'GET')+' '+url.replace(/^https:\/\/api\.github\.com\/repos\/[^/]+\/[^/]+/,'').replace(/\?.*$/,'')+' → '+res.status+' '+msg+(perm?'（必要な権限：'+perm+'）':''));
      var e=new Error(res.status+': '+t.slice(0,160)); e.status=res.status; throw e;
    }
    return res.json();
  }
  // 指定コミット時点の manifest を取得（無ければ空）
  async function getManifest(repo,token,ref){
    var url=apiBase(repo)+'/contents/'+DIR+'/manifest.json?ref='+encodeURIComponent(ref||repo.branch)+'&t='+Date.now();
    var h={'Accept':'application/vnd.github+json'}; if(token) h['Authorization']='Bearer '+token;
    var res=await fetch(url,{headers:h,cache:'no-store'});
    if(res.status===404) return {groups:[]};
    if(!res.ok){ var t=await res.text().catch(function(){return '';}); throw new Error(res.status+': '+t.slice(0,120)); }
    var d=await res.json();
    try{ var m=JSON.parse(b64utf8(d.content)); if(!Array.isArray(m.groups)) m.groups=[]; return m; }catch(e){ return {groups:[]}; }
  }
  async function makeBlob(repo,token,b64){
    var b=await gh(apiBase(repo)+'/git/blobs',{method:'POST',body:JSON.stringify({content:b64,encoding:'base64'})},token);
    return b.sha;
  }
  // 最新の manifest を土台に mutator を適用して1コミットで反映。競合時は取り直して再試行（強制上書きはしない）
  async function commitChange(s,mutator,fileEntries,message,deletePaths){
    var api=apiBase(s.repo), lastErr=null;
    for(var attempt=0; attempt<5; attempt++){
      try{
        var ref=await gh(api+'/git/ref/heads/'+encodeURIComponent(s.repo.branch)+'?t='+Date.now(),{},s.token);
        var baseSha=ref.object.sha;
        var man=await getManifest(s.repo,s.token,baseSha);
        mutator(man);
        man.updatedAt=Date.now();
        var manSha=await makeBlob(s.repo,s.token,utf8b64(JSON.stringify(man,null,1)));
        var entries=(fileEntries||[]).concat([{path:DIR+'/manifest.json',mode:'100644',type:'blob',sha:manSha}]);
        (deletePaths||[]).forEach(function(p){ entries.push({path:p,mode:'100644',type:'blob',sha:null}); });
        var baseCommit=await gh(api+'/git/commits/'+baseSha,{},s.token);
        var tree=await gh(api+'/git/trees',{method:'POST',body:JSON.stringify({base_tree:baseCommit.tree.sha,tree:entries})},s.token);
        var commit=await gh(api+'/git/commits',{method:'POST',body:JSON.stringify({message:message,tree:tree.sha,parents:[baseSha]})},s.token);
        await gh(api+'/git/refs/heads/'+encodeURIComponent(s.repo.branch),{method:'PATCH',body:JSON.stringify({sha:commit.sha,force:false})},s.token);
        return man;
      }catch(e){
        lastErr=e; var m=''+(e&&e.message||'');
        if(e.status===409 || m.indexOf('fast forward')>=0){ await new Promise(function(r){ setTimeout(r,400+attempt*300); }); continue; }
        throw e;
      }
    }
    throw lastErr||new Error('commit failed');
  }

  // ---------- 状態 ----------
  var groups=[];        // 表示中の商品グループ（保存済み＋アップ中）
  var loadState='idle'; // idle | loading | ready | nosetup | error
  var loadErr='';
  var dividers=[];      // 区切り線：n なら「n列目とn+1列目の間」
  function hasDiv(c){ return dividers.indexOf(c)>=0; }
  var localUrls={};     // 'groupId/file' -> blob URL（アップ直後はローカル画像で即表示）

  function imgSrc(g,im){
    var k=g.id+'|'+im.file;
    if(localUrls[k]) return localUrls[k];
    var repo=activeRepo(); if(!repo) return '';
    return rawBase(repo)+im.file+'?v='+(g.createdAt||0);
  }

  // ---------- 表示サイズ ----------
  var wInput=$('wInput');
  (function(){ var n=parseInt(lsGet('hikaku:w'),10); wInput.value=(n>=WMIN&&n<=WMAX)?n:WDEF; })();
  function clampW(){ var n=parseInt(wInput.value,10); if(isNaN(n)) n=WDEF; return Math.max(WMIN,Math.min(WMAX,n)); }
  function applyW(){
    var n=clampW(); wInput.value=n;
    document.documentElement.style.setProperty('--w',n+'px'); lsSet('hikaku:w',String(n));
    Array.prototype.forEach.call($('presets').children,function(b){ b.classList.toggle('on',+b.dataset.v===n); });
  }
  $('wMinus').addEventListener('click',function(){ wInput.value=clampW()-WSTEP; applyW(); });
  $('wPlus').addEventListener('click',function(){ wInput.value=clampW()+WSTEP; applyW(); });
  wInput.addEventListener('change',applyW);
  $('marks').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; setMarkMode(b.dataset.m||null); });
  $('presets').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; wInput.value=b.dataset.v; applyW(); });
  applyW();

  // ---------- 並び（空白）の補助 ----------
  function realCount(g){ return g.images.filter(function(im){ return !im.blank; }).length; }
  function groupRatio(g){ for(var i=0;i<g.images.length;i++){ var im=g.images[i]; if(!im.blank && im.w && im.h) return im.w+' / '+im.h; } return '1 / 1'; }
  function cleanImages(g){ return g.images.map(function(im){ var o=im.blank?{blank:true}:{file:im.file,name:im.name,w:im.w,h:im.h}; if(im.mark) o.mark=im.mark; return o; }); }

  // ---------- マーク ----------
  var MARKS={
    circle:{label:'○',color:'#23934a',svg:'<circle cx="12" cy="12" r="8"/>'},
    tri:   {label:'△',color:'#e07b00',svg:'<polygon points="12,3.5 21,19.5 3,19.5"/>'},
    square:{label:'□',color:'#2c67d1',svg:'<rect x="4.5" y="4.5" width="15" height="15"/>'},
    cross: {label:'×',color:'#d63333',svg:'<path d="M5 5 L19 19 M19 5 L5 19"/>'}
  };
  function markSvg(k){
    var m=MARKS[k]; if(!m) return '';
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">'+m.svg+'</g><g fill="none" stroke="'+m.color+'" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">'+m.svg+'</g></svg>';
  }
  function markHtml(k){ return k&&MARKS[k]?'<span class="mk">'+markSvg(k)+'</span>':''; }
  var markMode=null;   // null=通常（クリックで拡大） / circle・tri・square・cross / erase
  function setMarkMode(m){
    markMode=(markMode===m)?null:m;
    document.body.classList.toggle('marking',!!markMode);
    Array.prototype.forEach.call($('marks').querySelectorAll('button'),function(b){ b.classList.toggle('on',(b.dataset.m||null)===markMode); });
    $('markHint').style.display=markMode?'':'none';
  }
  function applyMark(g,i){
    var im=g.images[i]; if(!im || g.pending || g.busy) return;
    if(markMode==='erase' || im.mark===markMode) delete im.mark; else im.mark=markMode;
    scheduleLayoutSave(g);
  }

  // 空白の追加・画像削除は画面にすぐ反映し、少し待ってからまとめて1コミットで保存
  function scheduleLayoutSave(g,delPath){
    if(delPath) (g._dels=g._dels||[]).push(delPath);
    clearTimeout(g._saveTimer);
    g.saving=(g.saving||0)||1; render();
    g._saveTimer=setTimeout(function(){
      var s=needSetup(); if(!s){ g.saving=0; render(); return; }
      var dels=g._dels||[]; g._dels=[];
      var snap=cleanImages(g);
      var mut=function(man){ man.groups.forEach(function(x){ if(x.id===g.id) x.images=snap; }); };
      enqueue(async function(){
        try{
          if(dels.length){
            try{ await commitChange(s,mut,[],'比較くん：'+g.name+' の画像を削除',dels); }
            catch(e){ await commitChange(s,mut,[],'比較くん：'+g.name+' の並びを更新'); }
          } else {
            await commitChange(s,mut,[],'比較くん：'+g.name+' の並びを更新');
          }
        }catch(e){ alert('並びを保存できませんでした。\n'+e.message+'\n\nGitHubの最新状態を読み込み直します。'); g.saving=0; loadBoard(); return; }
        if(!g._saveTimer) g.saving=0;
        render();
      });
      g._saveTimer=null;
    },700);
  }

  // 商品の並び順の保存（連続クリックはまとめて1コミット）
  var orderSaving=false, orderTimer=null;
  function scheduleOrderSave(){
    clearTimeout(orderTimer); orderSaving=true; render();
    orderTimer=setTimeout(function(){
      orderTimer=null;
      var s=needSetup(); if(!s){ orderSaving=false; render(); return; }
      var order=groups.filter(function(g){ return !g.pending; }).map(function(g){ return g.id; });
      enqueue(async function(){
        try{
          await commitChange(s,function(man){
            var pos=function(id){ var i=order.indexOf(id); return i<0?1e9:i; };
            man.groups=man.groups.map(function(g,i){ return {g:g,i:i}; }).sort(function(x,y){ return (pos(x.g.id)-pos(y.g.id))||(x.i-y.i); }).map(function(x){ return x.g; });
          },[],'比較くん：商品の並び順を変更');
        }catch(e){ alert('並び順を保存できませんでした。\n'+e.message); orderSaving=false; loadBoard(); return; }
        if(!orderTimer && !divTimer) orderSaving=false;
        render();
      });
    },600);
  }

  // 区切り線の保存（連続クリックはまとめて1コミット）
  var divTimer=null;
  function scheduleDividerSave(){
    clearTimeout(divTimer); orderSaving=true; render();
    divTimer=setTimeout(function(){
      divTimer=null;
      var s=needSetup(); if(!s){ orderSaving=false; render(); return; }
      var snap=dividers.slice();
      enqueue(async function(){
        try{

  function safeName(n){ return String(n||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').replace(/^\.+/,'').trim()||'商品'; }
  function stampName(d){ return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'_'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds()); }

  // 無圧縮ZIP（画像はすでに圧縮済みなのでそのまま格納）
  var CRC_T=(function(){ var t=new Uint32Array(256); for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
  function crc32(u8){ var c=0xFFFFFFFF; for(var i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
  function makeZip(entries){ // entries: [{name, data:Uint8Array}]（フォルダは名前の末尾 /）
    var enc=new TextEncoder(), parts=[], central=[], offset=0, d=new Date();
    var dosTime=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
    var dosDate=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    entries.forEach(function(e){
      var nm=enc.encode(e.name), data=e.data||new Uint8Array(0), crc=crc32(data);
      var lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
      lh.setUint16(10,dosTime,true); lh.setUint16(12,dosDate,true); lh.setUint32(14,crc,true);
      lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
      parts.push(lh.buffer,nm,data);
      var ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
      ch.setUint16(12,dosTime,true); ch.setUint16(14,dosDate,true); ch.setUint32(16,crc,true);
      ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nm.length,true);
      ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true);
      ch.setUint32(38,/\/$/.test(e.name)?0x10:0,true); ch.setUint32(42,offset,true);
      central.push(ch.buffer,nm);
      offset+=30+nm.length+data.length;
    });
    var csize=0; central.forEach(function(b){ csize+=b.byteLength; });
    var end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true);
    end.setUint32(12,csize,true); end.setUint32(16,offset,true);
    return new Blob(parts.concat(central,[end.buffer]),{type:'application/zip'});
  }
  var EXT={'image/png':'.png','image/webp':'.webp','image/gif':'.gif','image/avif':'.avif','image/bmp':'.bmp'};

  $('dlGo').addEventListener('click',async function(){
    var sel=groups.filter(function(g){ return !g.pending && dlSel[g.id]; });
    if(!sel.length || dlBusy) return;
    var how=(canDir && $('dlHow').value==='dir')?'dir':'zip', root=null;
    if(how==='dir'){
      // 保存先を選ぶ（クリック直後に呼ぶ必要がある）。前回の場所から始まる
      try{ root=await window.showDirectoryPicker({id:'hikaku-dl',mode:'readwrite',startIn:'downloads'}); }
      catch(e){ if(e && e.name==='AbortError') return; log('err','保存先フォルダを開けませんでした：'+e.message+'（ZIPで保存します）'); how='zip'; }
    }
    dlBusy=true; updateDlBar();
    var prefix=dlPrefix(), folder=stampName(new Date()), multi=sel.length>1;
    var jobs=[], entries=[{name:folder+'/'}], used={};
    sel.forEach(function(g){
      var dir=folder+'/';
      if(multi){ var base=safeName(g.name), nm=base, k=2; while(used[nm]) nm=base+'_'+(k++); used[nm]=1; dir+=nm+'/'; entries.push({name:dir}); }
      var n=0; g.images.forEach(function(im){ if(!im.blank) jobs.push({g:g,im:im,path:dir+picName(prefix,++n)}); });
    });
    var done=0, failed=[];
    $('dlProg').textContent='準備中… 0/'+jobs.length;
    log('info','一括ダウンロード開始：'+sel.length+'商品・'+jobs.length+'枚 → '+(how==='dir'?'フォルダ '+folder:folder+'.zip'));
    var next=0;
    async function worker(){
      while(next<jobs.length){
        var j=jobs[next++];
        try{
          var res=await fetch(imgSrc(j.g,j.im),{cache:'no-store'});
          if(!res.ok) throw new Error(res.status);
          var blob=await res.blob();
          j.data=new Uint8Array(await blob.arrayBuffer()); j.ext=EXT[blob.type]||'.jpg';
        }catch(e){ failed.push(j.g.name+' / '+(j.im.name||'')+'（'+e.message+'）'); }
        done++; $('dlProg').textContent='準備中… '+done+'/'+jobs.length;
      }
    }
    try{
      await Promise.all([worker(),worker(),worker(),worker()]);
      var okN=jobs.length-failed.length, outName;
      if(how==='dir'){
        var dirs={};
        var getDir=async function(path){ // 'a/b/' → ハンドル
          if(dirs[path]) return dirs[path];
          var h=root, segs=path.split('/').filter(Boolean);
          for(var k=0;k<segs.length;k++) h=await h.getDirectoryHandle(segs[k],{create:true});
          return dirs[path]=h;
        };
        var w=0;
        for(var q=0;q<jobs.length;q++){
          var jb=jobs[q]; if(!jb.data) continue;
          var cut=jb.path.lastIndexOf('/'), dh=await getDir(jb.path.slice(0,cut+1));
          var fh=await dh.getFileHandle(jb.path.slice(cut+1)+jb.ext,{create:true});
          var ws=await fh.createWritable(); await ws.write(jb.data); await ws.close();
          w++; $('dlProg').textContent='保存中… '+w+'/'+okN;
        }
        if(!okN) await getDir(folder+'/');
        outName=(root.name?root.name+' / ':'')+folder;
      } else {
        jobs.forEach(function(j){ if(j.data) entries.push({name:j.path+j.ext,data:j.data}); });
        var zip=makeZip(entries), url=URL.createObjectURL(zip);
        var a=document.createElement('a'); a.href=url; a.download=folder+'.zip'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); },10000);
        outName=folder+'.zip';
      }
      $('dlProg').textContent='✓ '+outName+'（'+okN+'枚）';
      if(failed.length){ log('err','一括ダウンロードで取得できなかった画像：'+failed.join('、')); alert(failed.length+'枚の画像を取得できませんでした（それ以外はZIPに入っています）。詳しくは「📋 ログ」をご確認ください。'); }
      log('ok','一括ダウンロード完了：'+outName+'（'+okN+'枚）');
    }catch(e){
      $('dlProg').textContent='';
      log('err','一括ダウンロード失敗：'+e.message); alert('ダウンロードできませんでした。\n'+e.message);
    }
    dlBusy=false; updateDlBar();
  });

  boardWrap.addEventListener('click',function(e){

  // ---------- 読み込み ----------
  async function loadBoard(){
    var repo=activeRepo();
    if(!repo){ loadState='nosetup'; groups=groups.filter(function(g){ return g.pending; }); render(); return; }
    loadState='loading'; if(!groups.length) render();
    try{
      var man;
      try{ man=await getManifest(repo,getToken()); }
      catch(e){ // APIの回数制限などはrawで代替
        var r=await fetch(rawBase(repo)+'manifest.json?t='+Date.now(),{cache:'no-store'});
        if(r.status===404) man={groups:[]};
        else if(!r.ok) throw e;
        else man=await r.json();
      }
      var pend=groups.filter(function(g){ return g.pending; });
      groups=(man.groups||[]).concat(pend);
      dividers=(man.dividers||[]).filter(function(n){ return typeof n==='number'; });
      loadState='ready';
      log('info','読み込み：'+(man.groups||[]).length+'商品（'+repo.owner+'/'+repo.repo+'）');
    }catch(e){
      loadState='error'; loadErr=e.message; log('err','読み込み失敗：'+e.message);
    }
    render();
  }

  var queue=Promise.resolve();
  function enqueue(fn){ queue=queue.then(fn).catch(function(){}); return queue; }

  function guessName(names){
    var bases=names.map(function(n){ return n.replace(/\.[^.]+$/,''); });
    var p=bases[0]||'';
    bases.forEach(function(b){ var i=0; while(i<p.length&&i<b.length&&p[i]===b[i]) i++; p=p.slice(0,i); });
    p=p.replace(/[\s_\-.(（\[【]*\d*$/,'').trim();
    if(p.length>=2) return p;
    var one=(bases[0]||'').replace(/[\s_\-.]*\d+$/,'').trim();
    return one.length>=2 && bases.length===1 ? one : '商品 '+(groups.length+1);
  }

  function readImage(file){
    return new Promise(function(resolve,reject){
      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){ resolve({img:im,url:url,w:im.naturalWidth,h:im.naturalHeight}); };
      im.onerror=function(){ URL.revokeObjectURL(url); reject(new Error(file.name+' を読み込めませんでした')); };
      im.src=url;
    });
  }
  function toJpegB64(img,w,h){
    var scale=Math.min(1,MAX_DIM/Math.max(w,h));
    var cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
    var c=document.createElement('canvas'); c.width=cw; c.height=ch;
    var ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cw,ch);
    ctx.imageSmoothingQuality='high'; ctx.drawImage(img,0,0,cw,ch);
    return c.toDataURL('image/jpeg',QUALITY).split(',')[1];
  }

  // 空白の枠にドロップ → その位置に画像を入れる（複数ならその位置から順に）
  async function fillBlank(g,idx,fileList,append){
    var files=Array.prototype.filter.call(fileList||[],function(f){ return /^image\//.test(f.type)||/\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(f.name); });
    if(!files.length) return;
    var s=needSetup(); if(!s) return;
    if(!append && idx<g.images.length && !g.images[idx].blank) return;
    if(append) idx=g.images.length;
    files.sort(function(a,b){ return natSort(a.name,b.name); });
    clearTimeout(g._saveTimer); g._saveTimer=null;
    var dels=g._dels||[]; g._dels=[];
    var before=g.images.slice();
    if(!append) while(g.images.length<=idx) g.images.push({blank:true});
    g.busy='アップ中…'; render();
    var stamp=Date.now(), added=[], decoded=[];
    for(var k=0;k<files.length;k++){
      try{
        var d=await readImage(files[k]);
        var file=g.id+'/a'+stamp+'_'+pad2(k+1)+'.jpg';
        localUrls[g.id+'|'+file]=d.url;
        added.push({file:file,name:files[k].name,w:d.w,h:d.h}); decoded.push(d);
      }catch(e){ log('err',e.message); }
    }
    if(!added.length){ g.busy=null; render(); return; }
    g.images.splice.apply(g.images,[idx,append?0:1].concat(added));
    render();
    log('info',(append?'末尾に追加：':'空白に追加：')+g.name+' の'+(idx+1)+'列目へ '+added.length+'枚');
    enqueue(async function(){
      try{
        var entries=[];
        for(var k=0;k<decoded.length;k++){
          var sha=await makeBlob(s.repo,s.token,toJpegB64(decoded[k].img,decoded[k].w,decoded[k].h));
          entries.push({path:DIR+'/'+added[k].file,mode:'100644',type:'blob',sha:sha});
        }
        var snap=cleanImages(g);
        var mut=function(man){ man.groups.forEach(function(x){ if(x.id===g.id) x.images=snap; }); };
        try{ await commitChange(s,mut,entries,'比較くん：'+g.name+' に'+added.length+'枚追加',dels); }
        catch(e){ if(!dels.length) throw e; await commitChange(s,mut,entries,'比較くん：'+g.name+' に'+added.length+'枚追加'); }
        log('ok','空白に追加完了：'+g.name+'（'+added.length+'枚）');
      }catch(e){
        g.images=before;
        added.forEach(function(im){ var lk=g.id+'|'+im.file; if(localUrls[lk]){ URL.revokeObjectURL(localUrls[lk]); delete localUrls[lk]; } });
        log('err','空白への追加に失敗：'+g.name+' — '+e.message);
        alert('画像を追加できませんでした。\n'+e.message);
      }
      g.busy=null; render();
    });
  }

  async function handleFiles(fileList){
    var files=Array.prototype.filter.call(fileList||[],function(f){ return /^image\//.test(f.type)||/\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(f.name); });
    if(!files.length) return;
    var s=needSetup(); if(!s) return;
    files.sort(function(a,b){ return natSort(a.name,b.name); });

    var stamp=Date.now(), id='g'+stamp;
    var name=guessName(files.map(function(f){ return f.name; }));
    var g={id:id,name:name,createdAt:stamp,images:[],pending:true,progress:0,stateText:'読み込み中…',_files:files};
    groups.push(g);
    if(loadState!=='ready') loadState='ready';
    render();
    var b=$('board'); if(b) b.scrollTop=b.scrollHeight;

    // まずローカルで即表示
    g._decoded=[];
    for(var i=0;i<files.length;i++){
      try{
        var d=await readImage(files[i]);
        var file=id+'/'+pad2(i+1)+'.jpg';
        localUrls[id+'|'+file]=d.url;
        g.images.push({file:file,name:files[i].name,w:d.w,h:d.h});
        g._decoded.push(d);
      }catch(e){ /* 読めない画像は飛ばす */ }
    }
    if(!g.images.length){ g.error='画像を読み込めませんでした'; render(); return; }
    g.stateText='アップ待ち…'; render();
    enqueue(function(){ return uploadGroup(g); });
  }

  async function uploadGroup(g){
    var s=needSetup(); if(!s){ g.error='設定が必要です'; render(); return; }
    try{
      g.stateText='アップ中…'; g.progress=3; render();
      log('info','アップ開始：'+g.name+'（'+g.images.length+'枚）→ '+s.repo.owner+'/'+s.repo.repo);
      var entries=[];
      for(var i=0;i<g._decoded.length;i++){
        var d=g._decoded[i];
        var b64=toJpegB64(d.img,d.w,d.h);
        var sha=await makeBlob(s.repo,s.token,b64);
        entries.push({path:DIR+'/'+g.images[i].file,mode:'100644',type:'blob',sha:sha});
        g.progress=Math.round((i+1)/g._decoded.length*85); render();
      }
      g.stateText='反映中…'; render();
      var rec={id:g.id,name:g.name,createdAt:g.createdAt,images:g.images.map(function(im){ return {file:im.file,name:im.name,w:im.w,h:im.h}; })};
      await commitChange(s,function(man){
        man.groups=man.groups.filter(function(x){ return x.id!==rec.id; });
        man.groups.push(rec);
      },entries,'比較くん：'+g.name+'（'+g.images.length+'枚）を追加');
      g.pending=false; g.progress=100; delete g._decoded; delete g._files; delete g.stateText;
      log('ok','アップ完了：'+g.name+'（'+g.images.length+'枚）');
    }catch(e){
      g.error=e.message; g.errorCode=e.status||'';
      log('err','アップ失敗：'+g.name+' — '+e.message);
    }
    render();
  }

  var drop=$('drop'), fileInput=$('file'), bulkTarget=null;
  function setUpCollapsed(c){
    document.body.classList.toggle('upc',c);
    $('upToggle').textContent=c?'▼ 開く':'▲ 畳む';
    lsSet('hikaku:upc',c?'1':'0');
  }
  $('upToggle').addEventListener('click',function(){ setUpCollapsed(!document.body.classList.contains('upc')); });
  setUpCollapsed(lsGet('hikaku:upc')==='1');
  $('bulkFile').addEventListener('change',function(){ var f=this.files; if(bulkTarget && f && f.length) fillBlank(bulkTarget,0,f,true); bulkTarget=null; this.value=''; });
  fileInput.addEventListener('change',function(){ handleFiles(fileInput.files); fileInput.value=''; });
  // ドロップを受け付けるのは「上のアップ枠」「空白の枠」「行末の＋」だけ。それ以外では何もしない
  var dragDepth=0, overT=null;
  function hasFiles(e){ return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>=0; }
  function targetAt(e){
    var t=e.target; if(!t || !t.closest) return null;
    if(t.closest('#drop')) return {kind:'new',el:drop};
    if(document.body.classList.contains('upc') && t.closest('#upPanel')) return {kind:'new',el:$('upPanel')};
    var el=t.closest('.ph.bl, .lab .bulk'); if(!el) return null;
    var row=el.closest('.row'), g=row&&groups[+row.dataset.g];
    if(!g || g.pending || g.busy) return null;
    return {kind:el.classList.contains('bulk')?'append':'fill',el:el,g:g,i:+el.dataset.i};
  }
  function setOver(t){
    if(overT && (!t || overT.el!==t.el)) overT.el.classList.remove(overT.kind==='new'?'drag':'over');
    overT=t;
    if(t) t.el.classList.add(t.kind==='new'?'drag':'over');
  }
  function endDrag(){ dragDepth=0; setOver(null); document.body.classList.remove('dragging'); }
  window.addEventListener('dragenter',function(e){ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragover',function(e){
    if(!hasFiles(e)) return; e.preventDefault();  // ブラウザが画像を開いてしまうのを防ぐ
    var t=targetAt(e); setOver(t);
    e.dataTransfer.dropEffect=t?'copy':'none';
  });
  window.addEventListener('dragleave',function(e){ if(!hasFiles(e)) return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) endDrag(); });
  window.addEventListener('drop',function(e){
    if(!hasFiles(e)) return; e.preventDefault();
    var t=targetAt(e); endDrag();
    if(!t) return;
    if(t.kind==='new') handleFiles(e.dataTransfer.files);
    else fillBlank(t.g,t.i,e.dataTransfer.files,t.kind==='append');
  });

  // ---------- 名前変更 ----------
  function startRename(row,g){
    var el=row.querySelector('.gname'); if(!el || el.isContentEditable) return;
    el.contentEditable='true'; el.focus();
    var r=document.createRange(); r.selectNodeContents(el); var sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
    var done=false;
    function finish(save){
      if(done) return; done=true;
      el.contentEditable='false';
      var nv=el.textContent.replace(/\s+/g,' ').trim();
      if(!save || !nv || nv===g.name){ el.textContent=g.name; return; }
      renameGroup(g,nv);
    }
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } });
    el.addEventListener('blur',function(){ finish(true); },{once:true});
  }
  function renameGroup(g,nv){
    var s=needSetup(); if(!s) return;
    var old=g.name; g.name=nv; g.busy='保存中…'; render();
    enqueue(async function(){
      try{
        await commitChange(s,function(man){ man.groups.forEach(function(x){ if(x.id===g.id) x.name=nv; }); },[],'比較くん：名前変更 '+old+' → '+nv);
      }catch(e){ g.name=old; alert('名前を保存できませんでした。\n'+e.message); }
      g.busy=null; render();
    });
  }

  // ---------- 削除 ----------
  function deleteGroup(g){
    if(!confirm('「'+g.name+'」（'+realCount(g)+'枚）を削除しますか？\nGitHub上の画像も削除されます。')) return;
    var s=needSetup(); if(!s) return;
    g.busy='削除中…'; render();
    var paths=g.images.filter(function(im){ return !im.blank; }).map(function(im){ return DIR+'/'+im.file; });
    var mut=function(man){ man.groups=man.groups.filter(function(x){ return x.id!==g.id; }); };
    enqueue(async function(){
      try{
        try{ await commitChange(s,mut,[],'比較くん：'+g.name+' を削除',paths); }
        catch(e){ await commitChange(s,mut,[],'比較くん：'+g.name+' を一覧から削除'); } // 画像が既に無い場合など
        groups.splice(groups.indexOf(g),1);
        g.images.forEach(function(im){ var k=g.id+'|'+im.file; if(localUrls[k]){ URL.revokeObjectURL(localUrls[k]); delete localUrls[k]; } });
      }catch(e){ g.busy=null; alert('削除できませんでした。\n'+e.message); }
      g.busy=null; render();
    });
  }

  // ---------- 拡大表示 ----------
  var lb=$('lb'), lbImg=$('lbImg'), lbCap=$('lbCap'), cur={g:0,i:0};
  function showLb(){
    var g=groups[cur.g], im=g&&g.images[cur.i]; if(!im||im.blank) return;
    var no=0; for(var k=0;k<=cur.i;k++) if(!g.images[k].blank) no++;
    lbImg.src=imgSrc(g,im); lbImg.alt=im.name;
    lbCap.innerHTML=esc(g.name)+'　'+no+' / '+realCount(g)+'<small>'+esc(im.name)+'</small>';
  }
  function openLb(gi,ii){ cur={g:gi,i:ii}; showLb(); lb.classList.add('show'); }
  function closeLb(){ lb.classList.remove('show'); lbImg.removeAttribute('src'); }
  function stepImg(d){
    var g=groups[cur.g]; if(!g||!realCount(g)) return; var n=g.images.length, i=cur.i;
    do { i=(i+d+n)%n; } while(g.images[i].blank);
    cur.i=i; showLb();
  }
  function stepGroup(d){  // 同じ列（位置）の他の商品へ。空白の行は飛ばす
    for(var k=1;k<groups.length;k++){
      var gi=((cur.g+d*k)%groups.length+groups.length)%groups.length, im=groups[gi].images[cur.i];
      if(im && !im.blank){ cur.g=gi; showLb(); return; }
    }
  }
  $('lbPrev').addEventListener('click',function(){ stepImg(-1); });
  $('lbNext').addEventListener('click',function(){ stepImg(1); });
  $('lbClose').addEventListener('click',closeLb);
  lb.addEventListener('click',function(e){ if(e.target===lb||e.target.classList.contains('lb-main')) closeLb(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && markMode && !lb.classList.contains('show')){ setMarkMode(markMode); return; }
    if(!lb.classList.contains('show')) return;
    if(e.key==='Escape') closeLb();
    else if(e.key==='ArrowLeft') stepImg(-1);
    else if(e.key==='ArrowRight') stepImg(1);
    else if(e.key==='ArrowUp'){ e.preventDefault(); stepGroup(-1); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); stepGroup(1); }
  });
  // スワイプ（左右＝前後の画像）
  var tx=null, ty=null;
  lb.addEventListener('touchstart',function(e){ var t=e.touches[0]; tx=t.clientX; ty=t.clientY; },{passive:true});
  lb.addEventListener('touchend',function(e){
    if(tx===null) return; var t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty; tx=ty=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) stepImg(dx<0?1:-1);
    else if(Math.abs(dy)>60) stepGroup(dy<0?1:-1);
  });

  window.addEventListener('beforeunload',function(e){ if(groups.some(function(g){ return g.pending && !g.error; })){ e.preventDefault(); e.returnValue=''; } });

  Array.prototype.forEach.call($('marks').querySelectorAll('button[data-m]'),function(b){ if(MARKS[b.dataset.m]) b.innerHTML=markSvg(b.dataset.m); });
  loadBoard();
})();
</script>
